<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Logo Gift — 3s Overlay</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{position:fixed;inset:0;width:100%;height:100%}.stage{position:fixed;inset:0;pointer-events:none}.mark-wrap{position:absolute;left:50%;top:42%;width:min(41vw,42vh,400px);aspect-ratio:1;transform:translate(-50%,-50%) scale(.06);opacity:0;will-change:transform,opacity}.mark{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 9px 24px #000b)}.mark .cyan{fill:#25f4ee;filter:drop-shadow(0 0 12px #25f4ee99)}.mark .red{fill:#fe2c55;filter:drop-shadow(0 0 12px #fe2c5599)}.mark .front{fill:#fff;filter:drop-shadow(0 0 8px #ffffff77)}.rim{position:absolute;inset:4%;border:1px solid #b3ffff48;border-radius:50%;box-shadow:0 0 30px #25f4ee22,inset 0 0 35px #fe2c5522;opacity:0}.caption{display:none !important}.kicker{font-weight:800;letter-spacing:.23em;font-size:clamp(11px,1.35vw,18px);color:#8cffff}.name{font-size:clamp(26px,4.2vw,55px);font-weight:900;letter-spacing:.055em;margin:5px 0 1px}.sub,.message{font-size:clamp(14px,1.6vw,21px)}.message{margin-top:6px;color:#ffe8ee}.amount{margin-top:7px;color:#8ffffb;font-weight:800}.active .mark-wrap{animation:arrive 3s both}.active .rim{animation:rim 3s both}.active .caption{display:none !important}.active .cyan{animation:cyan 3s both}.active .red{animation:red 3s both}.active .front{animation:front 3s both}@keyframes arrive{0%{opacity:0;transform:translate(-50%,-50%) scale(.06)}12%{opacity:1;transform:translate(-50%,-50%) scale(.57)}23%{transform:translate(-50%,-50%) scale(1.12)}33%{transform:translate(-50%,-50%) scale(.97)}42%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}91%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-50%) scale(.03)}}@keyframes rim{0%,15%{opacity:0;transform:scale(.2)}30%{opacity:.65;transform:scale(.75)}60%{opacity:.32;transform:scale(1.12)}100%{opacity:0;transform:scale(1.55)}}@keyframes caption{0%,27%{opacity:0;transform:translateY(22px)}42%,78%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-19px)}}@keyframes cyan{0%,13%{transform:translate(-12px,13px);opacity:.1}27%,75%{transform:translate(-2.1px,1.8px);opacity:1}82%{transform:translate(-11px,5px)}86%{transform:translate(-2.1px,1.8px)}100%{opacity:0}}@keyframes red{0%,13%{transform:translate(13px,-11px);opacity:.1}27%,75%{transform:translate(2.1px,-1.8px);opacity:1}82%{transform:translate(13px,-6px)}86%{transform:translate(2.1px,-1.8px)}100%{opacity:0}}@keyframes front{0%,17%{opacity:0}29%,81%{opacity:1}100%{opacity:0}}.controls{position:fixed;bottom:17px;right:17px;display:flex;gap:8px}.controls button{border:1px solid #25f4ee66;border-radius:12px;padding:10px 14px;background:#101322e6;color:white;font:600 13px system-ui;cursor:pointer;backdrop-filter:blur(12px)}.controls button:hover{background:#203d45}.controls.hidden{display:none}.note{position:fixed;left:17px;bottom:17px;font:12px system-ui;color:#bafcfa}.note.hidden{display:none}
</style></head><body><canvas id="fx"></canvas><div class="stage" id="stage"><div class="rim"></div><div class="mark-wrap"><svg class="mark" viewBox="-4 -4 32 32" role="img" aria-label="TikTok musical note logo"><!-- Recognizable note silhouette with characteristic cyan and red offsets. --><defs><path id="note-path" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></defs><use href="#note-path" class="cyan"/><use href="#note-path" class="red"/><use href="#note-path" class="front"/></svg></div><div class="caption" style="display:none !important;"><div class="kicker"></div><div class="name"></div><div class="sub"></div><div class="message"></div><div class="amount"></div></div></div><div class="note" id="note">Click Play for sound · Space to replay</div><div class="controls" id="controls"><button id="play">▶ Play TikTok Logo</button><button id="sound">🔊 Sound on</button></div>
<script>
'use strict';
/* Three-second self-contained browser overlay. Use ?overlay=1 to hide controls.
   ?name=Viewer&creator=GOKU&message=Nice!&amount=2&sound=0
   Trigger: window.playTikTokLogoGift({name,creator,message,amount})
   or postMessage({type:'TIKTOK_LOGO_GIFT',payload:{...}}, '*').
   Sound can require a click in browser sources due to autoplay policy. */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d',{alpha:true}),stage=document.getElementById('stage'),qs=new URLSearchParams(location.search),overlay=qs.get('overlay')==='1';if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
let W,H,DPR,audio=null,muted=qs.get('sound')==='0',started=0,raf=0,active=false,particles=[];const TAU=Math.PI*2,clamp=v=>Math.max(0,Math.min(1,v)),rand=(a,b)=>a+Math.random()*(b-a);function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function tone(f,d,at,type='sine',vol=.05,to=0){if(muted||!audio)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.02)}
function noise(d,at,vol,high){if(muted||!audio)return;let n=audio.currentTime+at,b=audio.createBuffer(1,Math.ceil(audio.sampleRate*d),audio.sampleRate),v=b.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=(Math.random()*2-1)*(1-i/v.length);let source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();source.buffer=b;filter.type='lowpass';filter.frequency.value=high;gain.gain.setValueAtTime(.0001,n);gain.gain.exponentialRampToValueAtTime(vol,n+.01);gain.gain.exponentialRampToValueAtTime(.0001,n+d);source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start(n);source.stop(n+d)}
function playSound(){if(muted)return;unlock();noise(.23,.08,.029,2800);tone(120,.36,.08,'sine',.11,56);tone(245,.56,.16,'sawtooth',.023,730);tone(630,.34,.33,'triangle',.058,1250);[659.3,830.6,987.8,1318.5].forEach((f,i)=>tone(f,.48,.62+i*.11,'sine',.032));tone(1900,.45,1.25,'sine',.028,820);noise(.13,2.26,.018,4100);tone(95,.31,2.47,'sine',.07,42)}
const clean=(x,n)=>String(x??'').replace(/[\x00-\x1f]/g,'').slice(0,n);
function start(p={}){let name=clean(p.name??qs.get('name')??'A STAR',25),creator=clean(p.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),message=clean(p.message??qs.get('message')??'Keep creating!',75),amount=clean(p.amount??qs.get('amount')??'',12);stage.querySelector('.name').textContent=name.toUpperCase();stage.querySelector('.sub').textContent='sent a TikTok Logo to @'+creator;stage.querySelector('.message').textContent=message?'“'+message+'”':'';stage.querySelector('.amount').textContent=amount?'£'+amount:'';stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active');particles=Array.from({length:210},(_,i)=>({a:rand(0,TAU),v:rand(110,580),size:rand(.5,3.1),at:rand(.13,.65),life:rand(.6,1.35),h:i%3,seed:rand(0,TAU)}));started=performance.now();active=true;playSound();if(!raf)raf=requestAnimationFrame(frame)}
function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!active)return;let t=(now-started)/1000;if(t>=3){if(qs.get('loop')==='1'){start();return;}active=false;stage.classList.remove('active');cancelAnimationFrame(raf);raf=0;return}let cx=W/2,cy=H*.42,sc=Math.max(.6,Math.min(W/1100,H/740,1.35)),fade=clamp(t/.22)*clamp((3-t)/.45);let field=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.48);field.addColorStop(0,`rgba(9,20,28,${.48*fade})`);field.addColorStop(.35,`rgba(9,11,20,${.23*fade})`);field.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=field;ctx.fillRect(0,0,W,H);
for(let k=0;k<2;k++){let q=(t-(k?.46:.16))/.75;if(q>=0&&q<1){ctx.save();ctx.translate(cx,cy);ctx.scale(1,.76);ctx.strokeStyle=k?'#fe2c55':'#25f4ee';ctx.lineWidth=(7-5*q)*sc;ctx.shadowBlur=26;ctx.shadowColor=ctx.strokeStyle;ctx.globalAlpha=(1-q)**2*.88*fade;ctx.beginPath();ctx.arc(0,0,(22+380*q)*sc,0,TAU);ctx.stroke();ctx.restore()}}
for(const p of particles){let age=t-p.at;if(age<0||age>p.life)continue;let q=age/p.life,x=cx+Math.cos(p.a)*(30+p.v*age)*sc,y=cy+Math.sin(p.a)*(30+p.v*age)*sc*.75;ctx.globalAlpha=(1-q)**1.6*fade;ctx.fillStyle=p.h===0?'#25f4ee':p.h===1?'#fe2c55':'#f7ffff';ctx.shadowBlur=13;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(x,y,p.size*sc*(1-q*.5),0,TAU);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
// Brief horizontal chromatic glitch streaks accompany the entrance only.
let glitch=Math.max(0,1-t/.85);for(let i=0;i<16;i++){let y=cy+(i-8)*24*sc,x=cx+Math.sin(i*21.4+t*45)*150*sc,width=(30+(i*37%90))*sc;ctx.fillStyle=i%2?'#25f4ee':'#fe2c55';ctx.globalAlpha=glitch*(i%3===0?.35:.12);ctx.fillRect(x-width/2,y,width,1.5*sc)}ctx.globalAlpha=1;
}
window.playTikTokLogoGift=start;addEventListener('message',e=>{if(e.data?.type==='TIKTOK_LOGO_GIFT')start(e.data.payload||{})});document.getElementById('play').onclick=()=>{unlock();start()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)unlock()};document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlock();start()}});if(overlay)start();
</script></body></html>
