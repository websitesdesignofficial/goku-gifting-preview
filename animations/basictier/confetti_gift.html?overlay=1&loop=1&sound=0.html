<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confetti Gift — 3s Overlay</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}canvas{position:fixed;inset:0;width:100%;height:100%}.stage{position:fixed;inset:0;pointer-events:none}.cannon{position:absolute;top:47%;width:min(30vw,31vh,300px);aspect-ratio:1;opacity:0;filter:drop-shadow(0 14px 17px #000a)}.cannon svg{width:100%;height:100%;overflow:visible}.left{left:30%;transform:translate(-50%,25%) rotate(-36deg) scale(.4)}.right{right:30%;transform:translate(50%,25%) rotate(36deg) scale(.4)}.right svg{transform:scaleX(-1)}.active .left{animation:left 3s both}.active .right{animation:right 3s both}.caption{display:none !important}.kicker{font-size:clamp(12px,1.35vw,18px);color:#ffe4a4;font-weight:850;letter-spacing:.22em}.name{font-size:clamp(26px,4vw,53px);font-weight:900;letter-spacing:.05em;margin:5px 0}.sub,.message{font-size:clamp(13px,1.55vw,21px)}.message{margin-top:7px;color:#fff3fb}.amount{margin-top:7px;color:#ffe4a4;font-weight:800}@keyframes left{0%{opacity:0;transform:translate(-90%,55%) rotate(-65deg) scale(.4)}14%{opacity:1;transform:translate(-50%,25%) rotate(-36deg) scale(1.07)}25%,75%{opacity:1;transform:translate(-50%,25%) rotate(-36deg) scale(1)}100%{opacity:0;transform:translate(-70%,80%) rotate(-65deg) scale(.4)}}@keyframes right{0%,12%{opacity:0;transform:translate(90%,55%) rotate(65deg) scale(.4)}28%{opacity:1;transform:translate(50%,25%) rotate(36deg) scale(1.07)}38%,75%{opacity:1;transform:translate(50%,25%) rotate(36deg) scale(1)}100%{opacity:0;transform:translate(70%,80%) rotate(65deg) scale(.4)}}@keyframes words{0%,26%{opacity:0;transform:translateY(20px)}42%,78%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-17px)}}.active .caption{display:none !important}.controls{position:fixed;bottom:17px;right:17px;display:flex;gap:8px}.controls button{border:1px solid #ffc1eb77;border-radius:11px;padding:10px 14px;background:#22152be6;color:#fff;font:600 13px system-ui;cursor:pointer}.controls button:hover{background:#49334b}.controls.hidden,.note.hidden{display:none}.note{position:fixed;bottom:17px;left:17px;color:#ffe5f9;font:12px system-ui}
</style></head><body><canvas id="fx"></canvas><div class="stage" id="stage"><div class="cannon left"><svg viewBox="0 0 300 300" role="img" aria-label="Party cannon"><defs><linearGradient id="barrel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbe8"/><stop offset=".18" stop-color="#f7d48f"/><stop offset=".45" stop-color="#bb7a3c"/><stop offset=".7" stop-color="#ffe8ab"/><stop offset="1" stop-color="#784529"/></linearGradient><linearGradient id="paint" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff6fa"/><stop offset=".23" stop-color="#ffb7db"/><stop offset=".65" stop-color="#ea69a9"/><stop offset="1" stop-color="#8e386e"/></linearGradient><radialGradient id="mouth"><stop stop-color="#452b52"/><stop offset=".72" stop-color="#261b3f"/><stop offset="1" stop-color="#fff0bb"/></radialGradient></defs><path d="M63 258 L103 65 L237 65 L277 258Z" fill="url(#paint)" stroke="#ffe4b3" stroke-width="6"/><path d="M100 82 H240 M74 234 H266" stroke="url(#barrel)" stroke-width="18"/><path d="M86 147 L251 146 M82 190 L259 190" stroke="#fff5d1" stroke-width="8" opacity=".72"/><path d="M113 97 L92 226 M160 95 L157 227 M206 96 L226 225" stroke="#fff" stroke-width="4" opacity=".27"/><ellipse cx="170" cy="65" rx="68" ry="24" fill="url(#barrel)" stroke="#fff3ce" stroke-width="5"/><ellipse cx="170" cy="62" rx="51" ry="14" fill="url(#mouth)"/><path d="M64 259 Q170 284 277 259" fill="none" stroke="#7b4266" stroke-width="8"/><path d="M87 251 Q171 265 253 251" fill="none" stroke="#fff" stroke-width="3" opacity=".57"/></svg></div><div class="cannon right"><svg viewBox="0 0 300 300" role="img" aria-label="Party cannon"><defs><linearGradient id="barrel2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffbe8"/><stop offset=".18" stop-color="#f7d48f"/><stop offset=".45" stop-color="#bb7a3c"/><stop offset=".7" stop-color="#ffe8ab"/><stop offset="1" stop-color="#784529"/></linearGradient><linearGradient id="paint2" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#efffff"/><stop offset=".23" stop-color="#a7f5f2"/><stop offset=".65" stop-color="#46c9d9"/><stop offset="1" stop-color="#257399"/></linearGradient><radialGradient id="mouth2"><stop stop-color="#22425b"/><stop offset=".72" stop-color="#142c45"/><stop offset="1" stop-color="#fff0bb"/></radialGradient></defs><path d="M63 258 L103 65 L237 65 L277 258Z" fill="url(#paint2)" stroke="#ffe4b3" stroke-width="6"/><path d="M100 82 H240 M74 234 H266" stroke="url(#barrel2)" stroke-width="18"/><path d="M86 147 L251 146 M82 190 L259 190" stroke="#fff5d1" stroke-width="8" opacity=".72"/><path d="M113 97 L92 226 M160 95 L157 227 M206 96 L226 225" stroke="#fff" stroke-width="4" opacity=".27"/><ellipse cx="170" cy="65" rx="68" ry="24" fill="url(#barrel2)" stroke="#fff3ce" stroke-width="5"/><ellipse cx="170" cy="62" rx="51" ry="14" fill="url(#mouth2)"/><path d="M64 259 Q170 284 277 259" fill="none" stroke="#326a86" stroke-width="8"/><path d="M87 251 Q171 265 253 251" fill="none" stroke="#fff" stroke-width="3" opacity=".57"/></svg></div><div class="caption" style="display:none !important;"><div class="kicker"></div><div class="name"></div><div class="sub"></div><div class="message"></div><div class="amount"></div></div></div><div id="note" class="note">Click Play for sound · Space to replay</div><div id="controls" class="controls"><button id="play">▶ Play Confetti</button><button id="sound">🔊 Sound on</button></div>
<script>
'use strict';
/* 3-second transparent two-cannon overlay. No external assets.
   ?overlay=1 hides controls; ?name=Viewer&creator=GOKU&message=Celebrate!&amount=2
   window.playConfettiGift({name,creator,message,amount}) or
   postMessage({type:'CONFETTI_GIFT',payload:{name,creator,message,amount}}, '*'). */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d',{alpha:true}),stage=document.getElementById('stage'),qs=new URLSearchParams(location.search),overlay=true;if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
let W,H,DPR,raf=0,startTime=0,active=false,audio=null,muted=true,paper=[],ribbons=[];const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x));const colors=['#ff6fa5','#7ae6f4','#ffe07b','#b4a3ff','#90e3a1','#fff'];function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function thump(at){if(!audio||muted)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(110,n);o.frequency.exponentialRampToValueAtTime(36,n+.25);g.gain.setValueAtTime(.115,n);g.gain.exponentialRampToValueAtTime(.0001,n+.28);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+.3)}
function rustle(d,at,vol){if(!audio||muted)return;let n=audio.currentTime+at,b=audio.createBuffer(1,Math.ceil(audio.sampleRate*d),audio.sampleRate),v=b.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=(Math.random()*2-1)*(.45+.55*Math.sin(i*.007)**2);let src=audio.createBufferSource(),hp=audio.createBiquadFilter(),g=audio.createGain();src.buffer=b;hp.type='highpass';hp.frequency.value=1200;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(vol,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+d);src.connect(hp);hp.connect(g);g.connect(audio.destination);src.start(n);src.stop(n+d)}
function playSound(){if(muted)return;unlock();thump(.16);rustle(.65,.19,.027);thump(.46);rustle(1.25,.48,.034)}
const clean=(v,n)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,n);
function start(p={}){let name=clean(p.name??qs.get('name')??'A CELEBRANT',25),creator=clean(p.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),message=clean(p.message??qs.get('message')??'Time to celebrate!',75),amount=clean(p.amount??qs.get('amount')??'',12);stage.querySelector('.name').textContent=name.toUpperCase();stage.querySelector('.sub').textContent='sent Confetti to @'+creator;stage.querySelector('.message').textContent=message?'“'+message+'”':'';stage.querySelector('.amount').textContent=amount?'£'+amount:'';stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active');paper=Array.from({length:340},(_,i)=>({side:i%2,at:(i%2?.46:.16)+rand(0,.29),angle:rand(-2.25,-.83),v:rand(200,680),w:rand(3,12),h:rand(5,20),spin:rand(-9,9),phase:rand(0,TAU),color:colors[i%colors.length],life:rand(1.1,2.5)}));ribbons=Array.from({length:24},(_,i)=>({side:i%2,at:(i%2?.46:.16)+rand(0,.2),angle:rand(-2.1,-1.05),v:rand(190,470),phase:rand(0,TAU),color:colors[i%5],life:rand(1.2,2.3)}));startTime=performance.now();active=true;playSound();if(!raf)raf=requestAnimationFrame(frame)}
function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!active)return;let t=(now-startTime)/1000;if(t>=3){if(true){start();return;}active=false;stage.classList.remove('active');cancelAnimationFrame(raf);raf=0;return}let sc=Math.max(.6,Math.min(W/1100,H/750,1.35)),fade=clamp(t/.16)*clamp((3-t)/.48),cx=W/2,cy=H*.43;let bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.58);bg.addColorStop(0,`rgba(71,34,88,${.31*fade})`);bg.addColorStop(.5,`rgba(33,34,72,${.13*fade})`);bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(let k=0;k<2;k++){let at=k?.46:.16,q=(t-at)/.67;if(q<0||q>1)continue;let x=W*(k?.68:.32),y=H*.43;ctx.save();ctx.translate(x,y);ctx.scale(1,.78);ctx.globalAlpha=(1-q)**2*.8*fade;ctx.strokeStyle=k?'#8ff6f5':'#ffb6dc';ctx.lineWidth=(7-5*q)*sc;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=24;ctx.beginPath();ctx.arc(0,0,(20+330*q)*sc,0,TAU);ctx.stroke();ctx.restore()}
for(const p of paper){let age=t-p.at;if(age<0||age>p.life)continue;let dir=p.side?-1:1,x=W*(p.side?.68:.32)+dir*Math.cos(p.angle+Math.PI/2)*p.v*age*.6*sc+Math.sin(age*5+p.phase)*18*sc,y=H*.45+Math.sin(p.angle)*p.v*age*.83*sc+age*age*340*sc;ctx.save();ctx.translate(x,y);ctx.rotate(age*p.spin+p.phase);ctx.scale(Math.cos(age*7+p.phase),1);ctx.globalAlpha=(1-age/p.life)*fade;ctx.fillStyle=p.color;ctx.fillRect(-p.w*.5*sc,-p.h*.5*sc,p.w*sc,p.h*sc);ctx.restore()}
for(const r of ribbons){let age=t-r.at;if(age<0||age>r.life)continue;let dir=r.side?-1:1,x=W*(r.side?.68:.32)+dir*age*r.v*.5*sc,y=H*.43+Math.sin(r.angle)*age*r.v*.68*sc+age*age*300*sc;ctx.save();ctx.globalAlpha=(1-age/r.life)*.82*fade;ctx.strokeStyle=r.color;ctx.lineWidth=3*sc;ctx.shadowColor=r.color;ctx.shadowBlur=8;ctx.beginPath();for(let i=0;i<17;i++){let u=i/16,xx=x-dir*u*65*sc,yy=y+u*27*sc+Math.sin(u*TAU*2+age*9+r.phase)*11*sc;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.stroke();ctx.restore()}}
window.playConfettiGift=start;addEventListener('message',e=>{if(e.data?.type==='CONFETTI_GIFT')start(e.data.payload||{})});document.getElementById('play').onclick=()=>{unlock();start()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)unlock()};document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlock();start()}});if(overlay)start();
</script></body></html>
