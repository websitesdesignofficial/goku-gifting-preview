<script>
'use strict';
/* 3-second transparent brain gift; no external assets.
   ?overlay=1 hides buttons; ?name=Viewer&creator=GOKU&message=Mind%20blown!&amount=2

   postMessage({type:'BRAIN_TINGLES_GIFT',payload:{name,creator,message,amount}}, '*'). */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d',{alpha:true}),stage=document.getElementById('stage'),qs=new URLSearchParams(location.search),overlay=true;if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
let W,H,DPR,raf=0,startTime=0,active=false,audio=null,muted=true,sparks=[];const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x));function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function bowl(f,d,at,vol){if(!audio||muted)return;let n=audio.currentTime+at;for(const [mul,gain] of [[1,1],[2.01,.27],[3.92,.11]]){let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f*mul,n);o.frequency.linearRampToValueAtTime(f*mul*.999,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol*gain,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.025)}}

const clean=(v,n)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,n);

function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!active)return;let t=(now-startTime)/1000;if(t>=3){if(true){start();return;}active=false;stage.classList.remove('active');cancelAnimationFrame(raf);raf=0;return}let cx=W/2,cy=H*.42,sc=Math.max(.6,Math.min(W/1100,H/750,1.35)),fade=clamp(t/.3)*clamp((3-t)/.49),bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.48);bg.addColorStop(0,`rgba(111,52,134,${.32*fade})`);bg.addColorStop(.48,`rgba(56,38,109,${.15*fade})`);bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(let i=0;i<5;i++){let q=(t-.23-i*.37)/1.25;if(q<0||q>1)continue;ctx.save();ctx.translate(cx,cy);ctx.scale(1,.83);ctx.strokeStyle=i%2?'#deb5ff':'#fff1ff';ctx.lineWidth=(3-q*2)*sc;ctx.shadowColor='#d3a4ff';ctx.shadowBlur=20;ctx.globalAlpha=(1-q)**2*.51*fade;ctx.beginPath();ctx.arc(0,0,(82+230*q)*sc,0,TAU);ctx.stroke();ctx.restore()}
