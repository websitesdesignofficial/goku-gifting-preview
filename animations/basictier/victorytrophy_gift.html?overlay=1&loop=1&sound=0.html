</style></head><body><canvas id="fx"></canvas><div class="stage" id="stage"><div class="trophy-wrap"><svg class="trophy" viewBox="0 0 400 400" role="img" aria-label="Golden victory trophy"><defs><linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffce0"/><stop offset=".16" stop-color="#fce39a"/><stop offset=".34" stop-color="#c18a2c"/><stop offset=".53" stop-color="#fff2a7"/><stop offset=".73" stop-color="#a96520"/><stop offset=".88" stop-color="#eebf65"/><stop offset="1" stop-color="#fff6ba"/></linearGradient><linearGradient id="cup" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#73401b"/><stop offset=".12" stop-color="#f3c973"/><stop offset=".28" stop-color="#fff4b4"/><stop offset=".46" stop-color="#e3a940"/><stop offset=".76" stop-color="#a9631f"/><stop offset=".92" stop-color="#ffe28a"/><stop offset="1" stop-color="#6e3d19"/></linearGradient><radialGradient id="enamel" cx=".33" cy=".22"><stop stop-color="#edffff"/><stop offset=".27" stop-color="#6be0ff"/><stop offset=".66" stop-color="#1576bb"/><stop offset="1" stop-color="#143264"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="8"/></filter></defs>

<script>
'use strict';
/* 3-second transparent trophy overlay; no external assets.
   ?overlay=1 hides buttons; ?name=Viewer&creator=GOKU&message=Champion!&amount=2
   window.playVictoryTrophyGift({name,creator,message,amount}) or
   postMessage({type:'VICTORY_TROPHY_GIFT',payload:{name,creator,message,amount}}, '*'). */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d',{alpha:true}),stage=document.getElementById('stage'),qs=new URLSearchParams(location.search),overlay=true;if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
let W,H,DPR,raf=0,startTime=0,active=false,audio=null,muted=true,stars=[];const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x));function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function note(f,d,at,vol=.03,kind='sawtooth'){if(!audio||muted)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain(),filter=audio.createBiquadFilter();o.type=kind;o.frequency.value=f;filter.type='lowpass';filter.frequency.value=1600;g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(vol,n+.035);g.gain.setValueAtTime(vol*.8,n+d*.65);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(filter);filter.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.02)}
function shimmer(f,d,at){if(!audio||muted)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.04,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.02)}
function playSound(){if(muted)return;unlock();[392,523.25,659.25,783.99].forEach((f,i)=>note(f,.27,.11+i*.17,.03));[523.25,659.25,783.99].forEach((f,i)=>note(f,.8,.87+i*.04,.028));[1046.5,1318.5,1567.98].forEach((f,i)=>shimmer(f,.76,1.44+i*.08))}
const clean=(v,n)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,n);
function start(p={}){let name=clean(p.name??qs.get('name')??'A CHAMPION',25),creator=clean(p.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),message=clean(p.message??qs.get('message')??'Victory is yours!',75),amount=clean(p.amount??qs.get('amount')??'',12);stage.querySelector('.name').textContent=name.toUpperCase();stage.querySelector('.sub').textContent='sent a Victory Trophy to @'+creator;stage.querySelector('.message').textContent=message?'“'+message+'”':'';stage.querySelector('.amount').textContent=amount?'£'+amount:'';stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active');stars=Array.from({length:195},(_,i)=>({a:rand(0,TAU),v:rand(70,420),size:rand(.7,3.2),at:rand(.15,.88),life:rand(.65,1.65),h:i%4}));startTime=performance.now();active=true;playSound();if(!raf)raf=requestAnimationFrame(frame)}
function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!active)return;let t=(now-startTime)/1000;if(t>=3){if(true){start();return;}active=false;stage.classList.remove('active');cancelAnimationFrame(raf);raf=0;return}let cx=W/2,cy=H*.42,sc=Math.max(.6,Math.min(W/1100,H/750,1.35)),fade=clamp(t/.2)*clamp((3-t)/.48),bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.52);bg.addColorStop(0,`rgba(111,73,18,${.38*fade})`);bg.addColorStop(.48,`rgba(69,49,12,${.15*fade})`);bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(let k=0;k<2;k++){let q=(t-(k?.75:.22))/.75;if(q<0||q>1)continue;ctx.save();ctx.translate(cx,cy);ctx.scale(1,.78);ctx.globalAlpha=(1-q)**2*.76*fade;ctx.strokeStyle=k?'#ffe185':'#fff9d6';ctx.lineWidth=(8-6*q)*sc;ctx.shadowColor='#ffe27c';ctx.shadowBlur=25;ctx.beginPath();ctx.arc(0,0,(20+410*q)*sc,0,TAU);ctx.stroke();ctx.restore()}
for(const s of stars){let age=t-s.at;if(age<0||age>s.life)continue;let q=age/s.life,r=(40+s.v*age)*sc,x=cx+Math.cos(s.a)*r,y=cy+Math.sin(s.a)*r*.79-age*28*sc;ctx.save();ctx.translate(x,y);ctx.globalAlpha=(1-q)**1.5*fade;ctx.strokeStyle=s.h===0?'#fff':s.h===1?'#ffdc75':s.h===2?'#a8eeff':'#fff3b1';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=16;ctx.lineWidth=(s.h===0?1.7:1)*sc;let z=s.size*(s.h===0?3.7:2.3)*sc;ctx.beginPath();ctx.moveTo(-z,0);ctx.lineTo(z,0);ctx.moveTo(0,-z);ctx.lineTo(0,z);ctx.stroke();ctx.restore()}}
window.playVictoryTrophyGift=start;addEventListener('message',e=>{if(e.data?.type==='VICTORY_TROPHY_GIFT')start(e.data.payload||{})});document.getElementById('play').onclick=()=>{unlock();start()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)unlock()};document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlock();start()}});if(overlay)start();
</script></body></html>
