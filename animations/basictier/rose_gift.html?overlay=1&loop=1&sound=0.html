<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rose Gift — Animated Overlay</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}.controls{position:fixed;right:18px;bottom:18px;display:flex;gap:9px}.controls button{border:1px solid #ff91bb88;border-radius:12px;background:#250d1edc;color:#fff2f8;padding:10px 14px;font:600 13px system-ui;cursor:pointer;backdrop-filter:blur(12px);box-shadow:0 6px 22px #0008}.controls button:hover{background:#512039}.controls.hidden,.note.hidden{display:none}.note{position:fixed;bottom:18px;left:18px;color:#ffcfde;font:12px system-ui;text-shadow:0 2px 9px #000;opacity:.8}</style></head>
<body><canvas id="scene" aria-label="Animated rose appreciation gift"></canvas><div class="note" id="note">Click Play to enable sound · press Space to replay</div><div class="controls" id="controls"><button id="play">▶ Play rose gift</button><button id="sound">🔊 Sound on</button></div>
<script>
'use strict';
/* Single-file, five-second transparent overlay. Query: ?overlay=1&name=Viewer&creator=GOKU&message=Beautiful!&amount=2&sound=0
   Trigger: window.playRoseGift({name,creator,message,amount})
   Or postMessage({type:'ROSE_GIFT',payload:{name,creator,message,amount}}, '*').
   Sound playback requires a user gesture in most browsers. */
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:true}),qs=new URLSearchParams(location.search),overlay=true;if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
const P={red:'#ff345f',rose:'#ed1754',light:'#ff91ac',pale:'#ffe1e7',gold:'#ffd98b',green:'#34c486',dark:'#650b34'};
let W,H,DPR,run=null,started=0,raf=0,petals=[],motes=[],audio=null,muted=true;const TAU=Math.PI*2,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a));return t*t*(3-2*t)},fade=(a,b,c,d,t)=>smooth(a,b,t)*(1-smooth(c,d,t)),rand=(a,b)=>a+Math.random()*(b-a);
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function tone(freq,dur,at=0,type='sine',vol=.07,end=0){if(muted||!audio)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,n);if(end)o.frequency.exponentialRampToValueAtTime(end,n+dur);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.014);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+dur+.02)}
function sound(){if(muted)return;unlock();tone(120,.5,.08,'sine',.12,60);tone(660,.32,.26,'sine',.07,1320);[0,4,7,11,14].forEach((n,i)=>tone(261.63*2**(n/12),.85,.52+i*.13,'sine',.035));tone(1400,.45,1.2,'triangle',.035,620);tone(790,.8,2.25,'sine',.02,480);tone(500,.62,4.1,'sine',.04,180)}
const clean=(v,n)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,n);
function start(payload={}){run={name:clean(payload.name??qs.get('name')??'A STAR',25),creator:clean(payload.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),message:clean(payload.message??qs.get('message')??'A rose for you!',75),amount:clean(payload.amount??qs.get('amount')??'',12)};started=performance.now();petals=Array.from({length:68},(_,i)=>({x:rand(-.7,.7),y:rand(-.18,.18),vx:rand(-1,1),vy:rand(-1.6,-.15),spin:rand(-5,5),a:rand(-3,3),size:rand(7,20),at:rand(.5,2),color:i%4===0?P.pale:i%3===0?P.light:P.red}));motes=Array.from({length:165},()=>({x:rand(-1,1),y:rand(-1,1),r:rand(.5,2.4),at:rand(0,TAU),speed:rand(.4,2),h:Math.random()}));sound();if(!raf)raf=requestAnimationFrame(frame)}
window.playRoseGift=start;addEventListener('message',e=>{if(e.data?.type==='ROSE_GIFT')start(e.data.payload||{})});document.getElementById('play').onclick=()=>{unlock();start()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)unlock()};document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlock();start()}});
function glow(x,y,r,color,alpha){if(r<=0||alpha<=0)return;let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.globalAlpha=1}
function dot(x,y,r,color,a){ctx.globalAlpha=a;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,TAU);ctx.fill();ctx.globalAlpha=1}
function label(){}
function petal(x,y,w,h,angle,color,alpha=1,vein=true){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.globalAlpha=alpha;let g=ctx.createLinearGradient(-w*.55,-h*.8,w*.5,h*.7);g.addColorStop(0,P.pale);g.addColorStop(.21,color);g.addColorStop(.75,color);g.addColorStop(1,P.dark);ctx.fillStyle=g;ctx.shadowColor=color;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(0,h*.55);ctx.bezierCurveTo(-w*.5,h*.2,-w*.82,-h*.43,-w*.37,-h*.65);ctx.quadraticCurveTo(0,-h*.91,w*.37,-h*.65);ctx.bezierCurveTo(w*.82,-h*.43,w*.5,h*.2,0,h*.55);ctx.closePath();ctx.fill();if(vein){ctx.shadowBlur=0;ctx.strokeStyle='#ffe6ed55';ctx.lineWidth=1.15;ctx.beginPath();ctx.moveTo(0,h*.43);ctx.quadraticCurveTo(w*.12,-h*.1,0,-h*.66);ctx.stroke()}ctx.restore()}
function leaf(x,y,len,angle,s){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(s,s);let g=ctx.createLinearGradient(0,0,len,0);g.addColorStop(0,'#07503f');g.addColorStop(.6,P.green);g.addColorStop(1,'#b0ffb5');ctx.fillStyle=g;ctx.shadowColor=P.green;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(len*.22,-len*.48,len*.76,-len*.39,len,0);ctx.bezierCurveTo(len*.7,len*.33,len*.22,len*.23,0,0);ctx.fill();ctx.strokeStyle='#c3ffcc88';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.55,-len*.06,len,0);ctx.stroke();ctx.restore()}
function rose(cx,cy,sc,bloom,alpha){ctx.save();ctx.globalAlpha=alpha;const stem=195*sc,headY=cy-75*sc;ctx.strokeStyle='#0c533f';ctx.lineWidth=12*sc;ctx.lineCap='round';ctx.shadowColor=P.green;ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(cx,cy+stem*.65);ctx.bezierCurveTo(cx-14*sc,cy+80*sc,cx+16*sc,cy-2*sc,cx,headY+32*sc);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#65e2a5';ctx.lineWidth=2.5*sc;ctx.stroke();leaf(cx-4*sc,cy+45*sc,75*sc,Math.PI*.82,1);leaf(cx+5*sc,cy+82*sc,66*sc,-.26,1);
ctx.translate(cx,headY);let r=67*sc*(.22+.78*bloom);glow(0,0,r*2,P.red,.32*bloom);for(let layer=0;layer<4;layer++){let count=layer===0?7:layer===1?6:layer===2?5:4;for(let i=0;i<count;i++){let a=(i/count)*TAU+layer*.49,rad=r*(.48-layer*.115),x=Math.cos(a)*rad,y=Math.sin(a)*rad*.59+layer*3*sc,w=r*(.83-layer*.11),h=r*(1.1-layer*.12),rot=a+Math.PI/2+(1-bloom)*.24;petal(x,y,w,h,rot,layer%2?P.red:layer===3?P.dark:P.rose,1,layer<2)}}glow(0,0,r*.5,P.light,.25);petal(-5*sc,3*sc,r*.45,r*.63,-.36,P.red);petal(7*sc,-2*sc,r*.39,r*.58,.4,P.rose);ctx.restore()}
function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!run)return;let t=(now-started)/1000;if(t>=5){if(true){started=now;return;}run=null;cancelAnimationFrame(raf);raf=0;return}const cx=W/2,cy=H*.46,sc=Math.max(.55,Math.min(W/950,H/750,1.25)),power=fade(0,.23,4.25,5,t),bloom=smooth(.35,1.48,t),rise=smooth(.05,.7,t),out=1-smooth(4.38,4.99,t);
let bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.62);bg.addColorStop(0,`rgba(75,6,39,${.77*power})`);bg.addColorStop(.4,`rgba(40,7,34,${.54*power})`);bg.addColorStop(1,'rgba(20,4,17,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);glow(cx,cy-80*sc,340*sc,P.red,.22*power);glow(cx,cy-80*sc,210*sc,P.gold,.13*power);
for(const m of motes){let x=cx+m.x*W*.49+Math.sin(t*m.speed+m.at)*12*sc,y=cy+m.y*H*.47-t*16*m.speed*sc,tw=.4+.6*Math.sin(t*3*m.speed+m.at)**2;dot(x,y,m.r*sc,m.h>.75?P.gold:m.h>.4?P.light:P.pale,tw*.7*power)}
for(const hit of [.22,1.28]){let q=(t-hit)/.85;if(q>=0&&q<1){ctx.save();ctx.translate(cx,cy-75*sc);ctx.scale(1,.7);ctx.strokeStyle=hit<1?P.pale:P.gold;ctx.lineWidth=(7-5*q)*sc;ctx.shadowBlur=30;ctx.shadowColor=P.red;ctx.globalAlpha=(1-q)**2*.83*out;ctx.beginPath();ctx.arc(0,0,(25+350*q)*sc,0,TAU);ctx.stroke();ctx.restore();glow(cx,cy-75*sc,(90+W*.4*q)*sc,P.red,(1-q)**3*.28)}}
let burst=fade(.18,.3,.55,.85,t);ctx.save();ctx.translate(cx,cy-75*sc);for(let i=0;i<36;i++){let a=i*TAU/36,dist=(50+240*burst+Math.sin(i*4.9)*30)*sc;ctx.strokeStyle=i%3?P.light:P.gold;ctx.globalAlpha=burst*(i%4===0?.63:.29);ctx.lineWidth=(i%4===0?2.4:1)*sc;ctx.shadowBlur=16;ctx.shadowColor=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(Math.cos(a)*40*sc,Math.sin(a)*30*sc);ctx.lineTo(Math.cos(a)*dist,Math.sin(a)*dist*.75);ctx.stroke()}ctx.restore();
rose(cx,cy+(1-rise)*130*sc,sc*(.7+.3*rise),bloom,power);
for(const p of petals){let age=t-p.at;if(age<0)continue;let x=cx+p.x*110*sc+p.vx*age*95*sc+Math.sin(age*3+p.a)*22*sc,y=cy-105*sc+p.y*60*sc+p.vy*age*70*sc+age*age*80*sc;let alpha=fade(0,.18,2.2,3.6,age)*out;petal(x,y,p.size*sc,p.size*1.35*sc,p.a+age*p.spin,p.color,alpha,false)}
glow(cx,cy-75*sc,Math.max(W,H)*.52,P.pale,(1-smooth(.23,.52,t))*.18);
}if(overlay)start();
</script></body></html>
