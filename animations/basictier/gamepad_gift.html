<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gamepad Gift — 3s Overlay</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{position:fixed;inset:0;width:100%;height:100%}.stage{position:fixed;inset:0;pointer-events:none}.pad-wrap{position:absolute;left:50%;top:43%;width:min(60vw,59vh,600px);aspect-ratio:1.5;opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(-19deg);filter:drop-shadow(0 21px 22px #000c) drop-shadow(0 0 26px #67bbff55);will-change:transform,opacity}.pad{width:100%;height:100%;overflow:visible}.button-glow{animation:buttons 1.1s ease-in-out infinite alternate}.active .pad-wrap{animation:arrival 3s both}.caption{display:none !important}.kicker{font-size:clamp(12px,1.35vw,18px);font-weight:800;letter-spacing:.22em;color:#a9e6ff}.name{font-size:clamp(26px,4vw,52px);font-weight:900;letter-spacing:.04em;margin:5px 0}.sub,.message{font-size:clamp(13px,1.55vw,21px)}.message{margin-top:7px;color:#e7f5ff}.amount{margin-top:7px;color:#c5ff9a;font-weight:800}@keyframes arrival{0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(-19deg)}13%{opacity:1;transform:translate(-50%,-50%) scale(.78) rotate(9deg)}25%{transform:translate(-50%,-50%) scale(1.13) rotate(-3deg)}38%,79%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}90%{opacity:1;transform:translate(-50%,-50%) scale(1.05) rotate(3deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(.13) rotate(20deg)}}@keyframes words{0%,26%{opacity:0;transform:translateY(20px)}42%,79%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}@keyframes buttons{0%{opacity:.55}100%{opacity:1}}.active .caption{display:none !important}.controls{position:fixed;bottom:17px;right:17px;display:flex;gap:8px}.controls button{border:1px solid #98d5ff77;border-radius:11px;padding:10px 14px;background:#101527e6;color:#fff;font:600 13px system-ui;cursor:pointer}.controls button:hover{background:#254058}.controls.hidden,.note.hidden{display:none}.note{position:fixed;bottom:17px;left:17px;color:#ceeaff;font:12px system-ui}
</style></head><body><canvas id="fx"></canvas><div class="stage" id="stage"><div class="pad-wrap"><svg class="pad" viewBox="0 0 600 400" role="img" aria-label="Detailed game controller"><defs><linearGradient id="shell" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#bdcadc"/><stop offset=".12" stop-color="#65758c"/><stop offset=".3" stop-color="#2a384d"/><stop offset=".62" stop-color="#101a2c"/><stop offset=".88" stop-color="#394b65"/><stop offset="1" stop-color="#96acc5"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#526981"/><stop offset=".36" stop-color="#263750"/><stop offset=".72" stop-color="#17253a"/><stop offset="1" stop-color="#486481"/></linearGradient><radialGradient id="stick" cx=".34" cy=".22" r=".8"><stop stop-color="#6d8198"/><stop offset=".23" stop-color="#35475b"/><stop offset=".8" stop-color="#111b2a"/><stop offset="1" stop-color="#060a14"/></radialGradient><radialGradient id="glass" cx=".35" cy=".2"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".35" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="10"/></filter></defs>

<script>
'use strict';
/* 3-second transparent controller overlay; no external files.
   ?overlay=1 hides buttons. ?name=Viewer&creator=GOKU&message=GG!&amount=2
   window.playGamepadGift({name,creator,message,amount}) or
   postMessage({type:'GAMEPAD_GIFT',payload:{name,creator,message,amount}}, '*'). */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d',{alpha:true}),stage=document.getElementById('stage'),qs=new URLSearchParams(location.search),overlay=qs.get('overlay')==='1';if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
let W,H,DPR,raf=0,startTime=0,active=false,audio=null,muted=qs.get('sound')==='0',sparks=[];const TAU=Math.PI*2,clamp=x=>Math.max(0,Math.min(1,x)),rand=(a,b)=>a+Math.random()*(b-a);function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function tone(f,d,at,type='square',vol=.025,to=0){if(!audio||muted)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.02)}
function playSound(){if(muted)return;unlock();tone(110,.23,.05,'triangle',.08,50);tone(280,.45,.15,'sawtooth',.027,1260);tone(1300,.29,.42,'square',.026,360);tone(380,.36,.65,'sawtooth',.025,1670);tone(1900,.29,.86,'square',.025,460);[523,659,784].forEach((f,i)=>tone(f,.24,1.25+i*.1,'triangle',.021));tone(220,.31,2.1,'sine',.018,85)}
const clean=(v,n)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,n);
function start(p={}){let name=clean(p.name??qs.get('name')??'A PLAYER',25),creator=clean(p.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),message=clean(p.message??qs.get('message')??'Game on!',75),amount=clean(p.amount??qs.get('amount')??'',12);stage.querySelector('.name').textContent=name.toUpperCase();stage.querySelector('.sub').textContent='sent a Gamepad to @'+creator;stage.querySelector('.message').textContent=message?'“'+message+'”':'';stage.querySelector('.amount').textContent=amount?'£'+amount:'';stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active');sparks=Array.from({length:170},(_,i)=>({a:rand(0,TAU),v:rand(90,540),size:rand(.6,3.1),at:rand(.16,.73),life:rand(.5,1.3),h:i%5}));startTime=performance.now();active=true;playSound();if(!raf)raf=requestAnimationFrame(frame)}
function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!active)return;let t=(now-startTime)/1000;if(t>=3){if(qs.get('loop')==='1'){start();return;}active=false;stage.classList.remove('active');cancelAnimationFrame(raf);raf=0;return}let cx=W/2,cy=H*.43,sc=Math.max(.6,Math.min(W/1100,H/750,1.3)),fade=clamp(t/.2)*clamp((3-t)/.5);let g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.48);g.addColorStop(0,`rgba(25,65,115,${.39*fade})`);g.addColorStop(.5,`rgba(30,28,80,${.17*fade})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const at of [.2,.59]){let q=(t-at)/.68;if(q<0||q>1)continue;ctx.save();ctx.translate(cx,cy);ctx.scale(1,.68);ctx.strokeStyle=at<.3?'#b9f7ff':'#9b8dff';ctx.lineWidth=(7-5*q)*sc;ctx.globalAlpha=(1-q)**2*.74;ctx.shadowBlur=24;ctx.shadowColor=ctx.strokeStyle;ctx.beginPath();ctx.arc(0,0,(28+390*q)*sc,0,TAU);ctx.stroke();ctx.restore()}
for(const p of sparks){let age=t-p.at;if(age<0||age>p.life)continue;let q=age/p.life,r=(25+p.v*age)*sc,x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r*.68;ctx.save();ctx.translate(x,y);ctx.rotate(p.a);ctx.globalAlpha=(1-q)**1.5*fade;ctx.fillStyle=p.h===0?'#ffa5ca':p.h===1?'#86fff0':p.h===2?'#a591ff':p.h===3?'#fff':'#93c9ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fillRect(0,-p.size*.5*sc,p.size*(2.5-q)*sc,p.size*sc);ctx.restore()}
let beam=Math.max(0,1-t/.5);ctx.globalAlpha=beam*.5;ctx.strokeStyle='#8ff4ff';ctx.lineWidth=3*sc;ctx.shadowColor='#8ff4ff';ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(cx-W*.45,cy+H*.23);ctx.lineTo(cx-W*.11,cy+H*.07);ctx.stroke();ctx.globalAlpha=1;ctx.shadowBlur=0}
window.playGamepadGift=start;addEventListener('message',e=>{if(e.data?.type==='GAMEPAD_GIFT')start(e.data.payload||{})});document.getElementById('play').onclick=()=>{unlock();start()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)unlock()};document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlock();start()}});if(overlay)start();
</script></body></html>
