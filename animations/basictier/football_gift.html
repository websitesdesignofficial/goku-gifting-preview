<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Gift — 3s Overlay</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}canvas{position:fixed;inset:0;width:100%;height:100%}.stage{position:fixed;inset:0;pointer-events:none}.ball-wrap{position:absolute;left:50%;top:42%;width:min(42vw,43vh,440px);aspect-ratio:1;opacity:0;transform:translate(-50%,-50%) scale(.07);will-change:transform,opacity;filter:drop-shadow(0 14px 20px #000b) drop-shadow(0 0 20px #7adcf444)}.ball{width:100%;height:100%;overflow:visible}.ball-core{transform-origin:200px 200px}.active .ball-wrap{animation:flight 3s both}.active .ball-core{animation:spin 3s both}.caption{display:none !important}.kicker{font-size:clamp(12px,1.35vw,18px);letter-spacing:.2em;font-weight:800;color:#a9f5d4}.name{font-size:clamp(25px,4.1vw,52px);font-weight:900;letter-spacing:.04em;margin:5px 0}.sub,.message{font-size:clamp(13px,1.55vw,21px)}.message{margin-top:7px;color:#e8fbff}.amount{margin-top:7px;color:#d9ff9d;font-weight:800}.active .caption{display:none !important}@keyframes flight{0%{opacity:0;transform:translate(-170%,-94%) scale(.07) rotate(-80deg)}11%{opacity:1;transform:translate(-94%,-65%) scale(.46) rotate(-34deg)}24%{transform:translate(-50%,-50%) scale(1.2) rotate(5deg)}34%{transform:translate(-50%,-50%) scale(.91) rotate(0)}45%,78%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}88%{opacity:1;transform:translate(-45%,-52%) scale(1.08) rotate(7deg)}100%{opacity:0;transform:translate(90%,-110%) scale(.08) rotate(45deg)}}@keyframes spin{0%{transform:rotate(-160deg)}26%{transform:rotate(56deg)}45%{transform:rotate(72deg)}78%{transform:rotate(84deg)}100%{transform:rotate(280deg)}}@keyframes words{0%,27%{opacity:0;transform:translateY(21px)}43%,78%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-16px)}}.controls{position:fixed;bottom:17px;right:17px;display:flex;gap:8px}.controls button{border:1px solid #8bf5d877;border-radius:11px;padding:10px 14px;background:#102024e6;color:#fff;font:600 13px system-ui;cursor:pointer}.controls button:hover{background:#25433e}.controls.hidden,.note.hidden{display:none}.note{position:fixed;bottom:17px;left:17px;color:#cdfce6;font:12px system-ui}
</style></head><body><canvas id="fx"></canvas><div class="stage" id="stage"><div class="ball-wrap"><svg class="ball" viewBox="0 0 400 400" role="img" aria-label="Detailed football"><defs><radialGradient id="shell" cx=".31" cy=".23" r=".82"><stop stop-color="#fff"/><stop offset=".27" stop-color="#f7fafb"/><stop offset=".62" stop-color="#d9e2e9"/><stop offset=".84" stop-color="#9aaab8"/><stop offset="1" stop-color="#374555"/></radialGradient><radialGradient id="black" cx=".26" cy=".16" r=".95"><stop stop-color="#526475"/><stop offset=".23" stop-color="#263747"/><stop offset=".72" stop-color="#111d2a"/><stop offset="1" stop-color="#050b12"/></radialGradient><radialGradient id="sheen" cx=".2" cy=".15" r=".9"><stop stop-color="#fff" stop-opacity=".65"/><stop offset=".3" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#111827" stop-opacity=".35"/></radialGradient><clipPath id="sphere"><circle cx="200" cy="200" r="165"/></clipPath><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter></defs><ellipse cx="201" cy="365" rx="132" ry="17" fill="#031b26" opacity=".22" filter="url(#soft)"/><g class="ball-core"><circle cx="200" cy="200" r="165" fill="url(#shell)" stroke="#f4fcff" stroke-width="4"/><g clip-path="url(#sphere)"><path d="M200.0 137.0 Q240.5 144.2 329.3 22.0" fill="none" stroke="#8395a2" stroke-width="5"/><path d="M259.9 180.5 Q265.6 221.3 409.2 268.0" fill="none" stroke="#8395a2" stroke-width="5"/><path d="M237.0 251.0 Q200.0 269.0 200.0 420.0" fill="none" stroke="#8395a2" stroke-width="5"/><path d="M163.0 251.0 Q134.4 221.3 -9.2 268.0" fill="none" stroke="#8395a2" stroke-width="5"/><path d="M140.1 180.5 Q159.5 144.2 70.7 22.0" fill="none" stroke="#8395a2" stroke-width="5"/><polygon points="147.0,61.0 183.6,10.6 242.9,29.8 242.9,92.2 183.6,111.4" fill="url(#black)" stroke="#536272" stroke-width="5"/><path d="M200.0 109.0 L200.0 61.0" fill="none" stroke="#c5d1db" stroke-width="2" opacity=".43"/><polygon points="315.8,106.6 375.1,125.9 375.1,188.2 315.8,207.5 279.2,157.0" fill="url(#black)" stroke="#536272" stroke-width="5"/><path d="M286.5 171.9 L332.2 157.0" fill="none" stroke="#c5d1db" stroke-width="2" opacity=".43"/><polygon points="324.6,281.3 324.6,343.6 265.3,362.9 228.7,312.5 265.3,262.0" fill="url(#black)" stroke="#536272" stroke-width="5"/><path d="M253.5 273.6 L281.7 312.5" fill="none" stroke="#c5d1db" stroke-width="2" opacity=".43"/><polygon points="161.2,343.6 101.9,362.9 65.3,312.5 101.9,262.0 161.2,281.3" fill="url(#black)" stroke="#536272" stroke-width="5"/><path d="M146.5 273.6 L118.3 312.5" fill="none" stroke="#c5d1db" stroke-width="2" opacity=".43"/><polygon points="51.4,207.5 14.8,157.0 51.4,106.6 110.7,125.9 110.7,188.2" fill="url(#black)" stroke="#536272" stroke-width="5"/><path d="M113.5 171.9 L67.8 157.0" fill="none" stroke="#c5d1db" stroke-width="2" opacity=".43"/><polygon points="200.0,137.0 259.9,180.5 237.0,251.0 163.0,251.0 140.1,180.5" fill="url(#black)" stroke="#536675" stroke-width="6"/><polygon points="200.0,143.0 254.2,182.4 233.5,246.1 166.5,246.1 145.8,182.4" fill="none" stroke="#b4c5d1" stroke-width="1.5" opacity=".38"/><path d="M103 100 Q138 75 174 72 M96 139 Q84 159 78 181 M247 93 Q272 101 290 118" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="7" opacity=".48"/></g><circle cx="200" cy="200" r="165" fill="url(#sheen)"/><path d="M95 98 Q134 59 191 55" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="8" opacity=".75"/><circle cx="200" cy="200" r="165" fill="none" stroke="#dde8ee" stroke-width="3" opacity=".8"/></g></svg></div><div class="caption" style="display:none !important;"><div class="kicker"></div><div class="name"></div><div class="sub"></div><div class="message"></div><div class="amount"></div></div></div><div class="note" id="note">Click Play for whistle · Space to replay</div><div class="controls" id="controls"><button id="play">▶ Play Football</button><button id="sound">🔊 Sound on</button></div>
<script>
'use strict';
/* Self-contained 3-second transparent football overlay.
   ?overlay=1 hides controls; ?name=Viewer&creator=GOKU&message=GOAL!&amount=2
   window.playFootballGift({name,creator,message,amount}) or
   postMessage({type:'FOOTBALL_GIFT',payload:{name,creator,message,amount}}, '*'). */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d',{alpha:true}),stage=document.getElementById('stage'),qs=new URLSearchParams(location.search),overlay=qs.get('overlay')==='1';if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
let W,H,DPR,raf=0,startTime=0,active=false,audio=null,muted=qs.get('sound')==='0',flecks=[];const TAU=Math.PI*2,clamp=x=>Math.max(0,Math.min(1,x)),rand=(a,b)=>a+Math.random()*(b-a);function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function tone(f,d,at,type='sine',vol=.055,to=0){if(!audio||muted)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.014);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.03)}
function noise(d,at,vol,high){if(!audio||muted)return;let n=audio.currentTime+at,b=audio.createBuffer(1,Math.ceil(audio.sampleRate*d),audio.sampleRate),v=b.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=(Math.random()*2-1)*(1-i/v.length);let o=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();o.buffer=b;f.type='lowpass';f.frequency.value=high;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(f);f.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d)}
function playSound(){if(muted)return;unlock();noise(.24,.05,.028,1250);tone(105,.33,.14,'sine',.11,45);tone(1740,.34,.42,'sine',.065,2040);tone(1920,.28,.67,'sine',.053,1560);tone(2080,.38,.93,'sine',.053,1900);tone(132,.28,1.58,'triangle',.025,70)}
const clean=(v,n)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,n);
function start(p={}){let name=clean(p.name??qs.get('name')??'A PLAYER',25),creator=clean(p.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),message=clean(p.message??qs.get('message')??'What a strike!',75),amount=clean(p.amount??qs.get('amount')??'',12);stage.querySelector('.name').textContent=name.toUpperCase();stage.querySelector('.sub').textContent='sent a Football to @'+creator;stage.querySelector('.message').textContent=message?'“'+message+'”':'';stage.querySelector('.amount').textContent=amount?'£'+amount:'';stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active');flecks=Array.from({length:190},(_,i)=>({angle:rand(0,TAU),speed:rand(90,530),size:rand(.8,4.5),delay:rand(.15,.54),life:rand(.55,1.4),h:i%4}));startTime=performance.now();active=true;playSound();if(!raf)raf=requestAnimationFrame(frame)}
function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!active)return;let t=(now-startTime)/1000;if(t>=3){if(qs.get('loop')==='1'){start();return;}active=false;stage.classList.remove('active');cancelAnimationFrame(raf);raf=0;return}let cx=W/2,cy=H*.42,sc=Math.max(.6,Math.min(W/1100,H/750,1.3)),fade=clamp(t/.2)*clamp((3-t)/.48);let g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.49);g.addColorStop(0,`rgba(16,67,61,${.42*fade})`);g.addColorStop(.42,`rgba(13,58,70,${.25*fade})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// Kick streaks rush toward the viewer, then split into short turf-coloured shards.
let streak=clamp(t/.22)*clamp((.65-t)/.4);ctx.save();ctx.globalAlpha=streak*.75;ctx.lineCap='round';for(let i=0;i<26;i++){let a=i*TAU/26,r1=(65+i%5*17)*sc,r2=r1+(75+i%7*18)*sc;ctx.strokeStyle=i%4?'#b9f9ea':'#fff';ctx.lineWidth=(i%5===0?3:1.2)*sc;ctx.shadowColor='#93ffe0';ctx.shadowBlur=13;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1*.76);ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2*.76);ctx.stroke()}ctx.restore();
for(let k=0;k<2;k++){let q=(t-(k?.57:.23))/.7;if(q>=0&&q<1){ctx.save();ctx.translate(cx,cy);ctx.scale(1,.76);ctx.globalAlpha=(1-q)**2*.75*fade;ctx.strokeStyle=k?'#c8fff0':'#fff';ctx.lineWidth=(7-5*q)*sc;ctx.shadowColor='#a7f9e3';ctx.shadowBlur=22;ctx.beginPath();ctx.arc(0,0,(20+370*q)*sc,0,TAU);ctx.stroke();ctx.restore()}}
for(const f of flecks){let age=t-f.delay;if(age<0||age>f.life)continue;let q=age/f.life,r=(35+f.speed*age)*sc,x=cx+Math.cos(f.angle)*r,y=cy+Math.sin(f.angle)*r*.75+age*age*28*sc;ctx.globalAlpha=(1-q)**1.5*fade;ctx.fillStyle=f.h===0?'#d0ff9a':f.h===1?'#76d6a9':f.h===2?'#ffffff':'#b7efff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=11;ctx.beginPath();ctx.ellipse(x,y,f.size*sc,(f.size*.5)*sc,f.angle,0,TAU);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0}
window.playFootballGift=start;addEventListener('message',e=>{if(e.data?.type==='FOOTBALL_GIFT')start(e.data.payload||{})});document.getElementById('play').onclick=()=>{unlock();start()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)unlock()};document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlock();start()}});if(overlay)start();
</script></body></html>
