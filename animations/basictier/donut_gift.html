<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donut Gift — 3s Overlay</title><style>

:17px;color:#ffe0ec;font:12px system-ui}
</style></head><body><canvas id="fx"></canvas><div class="stage" id="stage"><div class="donut-wrap"><svg class="donut" viewBox="0 0 400 400" role="img" aria-label="Glazed sprinkled donut"><defs><radialGradient id="dough" cx=".34" cy=".26" r=".8"><stop stop-color="#fff2c8"/><stop offset=".26" stop-color="#eab66f"/><stop offset=".57" stop-color="#b86b35"/><stop offset=".8" stop-color="#8b4827"/><stop offset="1" stop-color="#4d2a1d"/></radialGradient><radialGradient id="icing" cx=".3" cy=".2" r=".9"><stop stop-color="#fff6fa"/><stop offset=".27" stop-color="#ffc2dd"/><stop offset=".59" stop-color="#f578ad"/><stop offset=".83" stop-color="#d64287"/><stop offset="1" stop-color="#9b2c62"/></radialGradient><linearGradient id="highlight" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".4" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="7"/></filter><clipPath id="icingclip"><path fill-rule="evenodd" d="M200 45 C270 37 332 80 350 133 Q369 154 356 174 Q348 186 351 205 Q359 240 329 253 Q311 261 309 284 Q305 313 277 309 Q255 306 239 333 Q221 352 201 339 Q178 329 157 344 Q128 347 116 320 Q106 303 82 303 Q55 290 60 264 Q72 240 53 217 Q39 189 57 167 Q51 141 77 119 Q102 79 146 60 Q173 47 200 45Z M200 136 C164 134 132 157 131 198 Q131 239 172 261 Q210 276 248 244 Q279 213 266 175 Q252 140 200 136Z"/></clipPath></defs>

<script>
'use strict';
/* Three-second transparent donut overlay, no external assets.
   ?overlay=1 hides controls; ?name=Viewer&creator=GOKU&message=Sweet!&amount=2
   window.playDonutGift({name,creator,message,amount}) or
   postMessage({type:'DONUT_GIFT',payload:{name,creator,message,amount}}, '*'). */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d',{alpha:true}),stage=document.getElementById('stage'),qs=new URLSearchParams(location.search),overlay=qs.get('overlay')==='1';if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
let W,H,DPR,raf=0,startTime=0,active=false,audio=null,muted=qs.get('sound')==='0',sprinkles=[];const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x));function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function tone(f,d,at,type='sine',vol=.04,to=0){if(!audio||muted)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.009);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.02)}
function crunch(d,at,vol){if(!audio||muted)return;let n=audio.currentTime+at,b=audio.createBuffer(1,Math.ceil(audio.sampleRate*d),audio.sampleRate),v=b.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=(Math.random()*2-1)*Math.exp(-i/audio.sampleRate*20)*(1+.4*Math.sin(i*.061));let src=audio.createBufferSource(),lp=audio.createBiquadFilter(),g=audio.createGain();src.buffer=b;lp.type='lowpass';lp.frequency.value=1600;g.gain.value=vol;src.connect(lp);lp.connect(g);g.connect(audio.destination);src.start(n);src.stop(n+d)}
function playSound(){if(muted)return;unlock();tone(340,.21,.12,'sine',.048,710);tone(580,.23,.34,'triangle',.035,990);crunch(.18,.48,.031);tone(210,.14,.5,'sine',.06,120);[784,987,1175].forEach((f,i)=>tone(f,.27,.76+i*.1,'sine',.026));crunch(.09,1.34,.015);tone(450,.4,1.49,'sine',.014,280)}
const clean=(v,n)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,n);
function start(p={}){let name=clean(p.name??qs.get('name')??'A SWEETHEART',25),creator=clean(p.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),message=clean(p.message??qs.get('message')??'A sweet treat!',75),amount=clean(p.amount??qs.get('amount')??'',12);stage.querySelector('.name').textContent=name.toUpperCase();stage.querySelector('.sub').textContent='sent a Donut to @'+creator;stage.querySelector('.message').textContent=message?'“'+message+'”':'';stage.querySelector('.amount').textContent=amount?'£'+amount:'';stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active');sprinkles=Array.from({length:155},(_,i)=>({a:rand(0,TAU),speed:rand(50,460),size:rand(2,6),delay:rand(.2,.8),life:rand(.6,1.4),spin:rand(-7,7),h:i%5}));startTime=performance.now();active=true;playSound();if(!raf)raf=requestAnimationFrame(frame)}
function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!active)return;let t=(now-startTime)/1000;if(t>=3){if(qs.get('loop')==='1'){start();return;}active=false;stage.classList.remove('active');cancelAnimationFrame(raf);raf=0;return}let cx=W/2,cy=H*.42,sc=Math.max(.6,Math.min(W/1100,H/750,1.35)),fade=clamp(t/.22)*clamp((3-t)/.48),bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.49);bg.addColorStop(0,`rgba(111,37,78,${.38*fade})`);bg.addColorStop(.48,`rgba(73,23,57,${.16*fade})`);bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(const at of [.24,.65]){let q=(t-at)/.65;if(q<0||q>1)continue;ctx.save();ctx.translate(cx,cy);ctx.scale(1,.78);ctx.strokeStyle=at<.4?'#fff1d4':'#ffb2d4';ctx.lineWidth=(6-4*q)*sc;ctx.shadowColor='#ffa9d0';ctx.shadowBlur=22;ctx.globalAlpha=(1-q)**2*.65*fade;ctx.beginPath();ctx.arc(0,0,(27+355*q)*sc,0,TAU);ctx.stroke();ctx.restore()}
for(const s of sprinkles){let age=t-s.delay;if(age<0||age>s.life)continue;let q=age/s.life,r=(24+s.speed*age)*sc,x=cx+Math.cos(s.a)*r,y=cy+Math.sin(s.a)*r*.78+age*age*105*sc;ctx.save();ctx.translate(x,y);ctx.rotate(age*s.spin);ctx.globalAlpha=(1-q)**1.3*fade;ctx.fillStyle=s.h===0?'#fff':s.h===1?'#ff84b6':s.h===2?'#94f6e6':s.h===3?'#ffe78d':'#b8a1f6';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=9;ctx.fillRect(-s.size*sc,-s.size*.24*sc,s.size*2*sc,s.size*.48*sc);ctx.restore()}}
window.playDonutGift=start;addEventListener('message',e=>{if(e.data?.type==='DONUT_GIFT')start(e.data.payload||{})});document.getElementById('play').onclick=()=>{unlock();start()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)unlock()};document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlock();start()}});if(overlay)start();
</script></body></html>
