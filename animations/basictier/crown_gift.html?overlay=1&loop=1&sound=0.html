<script>
'use strict';
/* 3-second transparent crown overlay; no external assets.
   ?overlay=1 hides buttons; ?name=Viewer&creator=GOKU&message=Royal!&amount=2
   window.playCrownGift({name,creator,message,amount}) or
   postMessage({type:'CROWN_GIFT',payload:{name,creator,message,amount}}, '*'). */
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d',{alpha:true}),stage=document.getElementById('stage'),qs=new URLSearchParams(location.search),overlay=true;if(overlay){document.getElementById('controls').classList.add('hidden');document.getElementById('note').classList.add('hidden')}
let W,H,DPR,raf=0,startTime=0,active=false,audio=null,muted=true,glints=[];const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=x=>Math.max(0,Math.min(1,x));function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function unlock(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{muted=true}}
function brass(f,d,at,vol=.033){if(!audio||muted)return;let n=audio.currentTime+at,o=audio.createOscillator(),harm=audio.createOscillator(),g=audio.createGain(),hg=audio.createGain();o.type='sawtooth';o.frequency.value=f;harm.type='sine';harm.frequency.value=f*2.01;hg.gain.value=.3;harm.connect(hg);hg.connect(g);g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(vol,n+.07);g.gain.setValueAtTime(vol*.73,n+d*.7);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);harm.start(n);o.stop(n+d+.02);harm.stop(n+d+.02)}
function chime(f,d,at){if(!audio||muted)return;let n=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.033,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.02)}
function playSound(){if(muted)return;unlock();[261.63,329.63,392].forEach((f,i)=>brass(f,.52,.13+i*.09,.024));[349.23,440,523.25].forEach((f,i)=>brass(f,.59,.64+i*.08,.026));[523.25,659.25,783.99].forEach((f,i)=>chime(f*2,.85,1.19+i*.11))}
const clean=(v,n)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,n);
function start(p={}){let name=clean(p.name??qs.get('name')??'ROYAL SUPPORTER',25),creator=clean(p.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),message=clean(p.message??qs.get('message')??'You dropped this, king.',75),amount=clean(p.amount??qs.get('amount')??'',12);stage.querySelector('.name').textContent=name.toUpperCase();stage.querySelector('.sub').textContent='sent a Crown to @'+creator;stage.querySelector('.message').textContent=message?'“'+message+'”':'';stage.querySelector('.amount').textContent=amount?'£'+amount:'';stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active');glints=Array.from({length:180},(_,i)=>({a:rand(0,TAU),r:rand(50,380),size:rand(.6,3),at:rand(.14,.92),life:rand(.5,1.45),h:i%4}));startTime=performance.now();active=true;playSound();if(!raf)raf=requestAnimationFrame(frame)}
function frame(now){raf=requestAnimationFrame(frame);ctx.clearRect(0,0,W,H);if(!active)return;let t=(now-startTime)/1000;if(t>=3){if(true){start();return;}active=false;stage.classList.remove('active');cancelAnimationFrame(raf);raf=0;return}let cx=W/2,cy=H*.42,sc=Math.max(.6,Math.min(W/1100,H/750,1.35)),fade=clamp(t/.23)*clamp((3-t)/.48),bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.52);bg.addColorStop(0,`rgba(120,79,14,${.39*fade})`);bg.addColorStop(.5,`rgba(76,47,12,${.16*fade})`);bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(const at of [.2,.72]){let q=(t-at)/.72;if(q<0||q>1)continue;ctx.save();ctx.translate(cx,cy);ctx.scale(1,.68);ctx.globalAlpha=(1-q)**2*.73*fade;ctx.strokeStyle=at<.3?'#fff9d5':'#ffd270';ctx.lineWidth=(7-5*q)*sc;ctx.shadowColor='#ffd36a';ctx.shadowBlur=25;ctx.beginPath();ctx.arc(0,0,(25+400*q)*sc,0,TAU);ctx.stroke();ctx.restore()}
for(const g of glints){let age=t-g.at;if(age<0||age>g.life)continue;let q=age/g.life,r=g.r*sc+age*45*sc,x=cx+Math.cos(g.a)*r,y=cy+Math.sin(g.a)*r*.8-age*30*sc;ctx.save();ctx.translate(x,y);ctx.globalAlpha=(1-q)**1.4*fade;ctx.strokeStyle=g.h===0?'#fff':g.h===1?'#ffdb79':g.h===2?'#ffe5a3':'#a7ecff';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=16;ctx.lineWidth=(g.h===0?1.8:1)*sc;let z=g.size*(g.h===0?4:2)*sc;ctx.beginPath();ctx.moveTo(-z,0);ctx.lineTo(z,0);ctx.moveTo(0,-z);ctx.lineTo(0,z);ctx.stroke();ctx.restore()}}
window.playCrownGift=start;addEventListener('message',e=>{if(e.data?.type==='CROWN_GIFT')start(e.data.payload||{})});document.getElementById('play').onclick=()=>{unlock();start()};document.getElementById('sound').onclick=()=>{muted=!muted;document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)unlock()};document.getElementById('sound').textContent=muted?'🔇 Sound off':'🔊 Sound on';addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();unlock();start()}});if(overlay)start();
</script></body></html>
